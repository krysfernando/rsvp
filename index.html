<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding RSVP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf7f2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .card {
      max-width: 420px;
      padding: 24px;
    }

    h2 {
      margin-bottom: 8px;
    }

    p {
      color: #444;
      font-size: 15px;
      margin-bottom: 20px;
    }

    a.button {
      display: inline-block;
      margin: 10px;
      padding: 14px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      min-width: 180px;
    }

    .email {
      background: #222;
      color: white;
    }

    .text {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Wedding RSVP 💍</h2>
    <p>Please choose how you'd like to confirm your attendance.</p>

    <!-- EMAIL RSVP -->
    <a class="button email"
       href="mailto:your@email.com?subject=Wedding%20RSVP&body=Yes,%20I%E2%80%99ll%20be%20coming%20to%20your%20wedding.%20Can%E2%80%99t%20wait%20to%20share%20the%20day%20with%20you%20both!">
      RSVP by Email
    </a>

    <!-- SMS RSVP -->
    <a class="button text" id="smsLink" href="#">
      RSVP by Text
    </a>
  </div>

  <script>
    const phone = "+1234567890";

    const message =
      "Hi! I am confirming that I will be attending your wedding. Looking forward to celebrating with you both!";

    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const separator = isIOS ? "&" : "?";

    document.getElementById("smsLink").href =
      `sms:${phone}${separator}body=${encodeURIComponent(message)}`;
  </script>
</body>
</html>
