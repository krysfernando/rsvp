<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding RSVP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf7f2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .card {
      max-width: 420px;
      padding: 24px;
    }

    a.button {
      display: inline-block;
      margin: 10px;
      padding: 14px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
    }

    .email {
      background: #222;
      color: white;
    }

    .text {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Wedding RSVP 💍</h2>
    <p>Please choose how you'd like to respond:</p>

    <a class="button email"
       href="mailto:your@email.com?subject=Wedding%20RSVP">
       RSVP by Email
    </a>

    <a class="button text"
       href="./rsvp.html">
       RSVP by Text
    </a>
  </div>
</body>
</html>
